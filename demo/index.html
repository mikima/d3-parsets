<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>d3.parsets demo (D3 v7)</title>
<link rel="stylesheet" href="../d3.parsets.css">
<style>
  body { font-family: sans-serif; margin: 20px; }
  svg { display: block; }
</style>
</head>
<body>
<h1>d3.parsets — D3 v7 smoke test</h1>
<svg width="960" height="600"></svg>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="../d3.parsets.js"></script>
<script>
var classes = ["1st", "2nd", "3rd", "Crew"],
    sexes = ["Male", "Female"],
    survived = ["Yes", "No"],
    data = [];

// Build a synthetic Titanic-like dataset, same shape as the classic
// parallel sets example, to exercise dimensions, sorting and drag.
var counts = {
  "1st,Male,No": 118, "1st,Male,Yes": 62,
  "1st,Female,No": 4, "1st,Female,Yes": 141,
  "2nd,Male,No": 154, "2nd,Male,Yes": 25,
  "2nd,Female,No": 13, "2nd,Female,Yes": 93,
  "3rd,Male,No": 387, "3rd,Male,Yes": 88,
  "3rd,Female,No": 89, "3rd,Female,Yes": 90,
  "Crew,Male,No": 670, "Crew,Male,Yes": 192,
  "Crew,Female,No": 3, "Crew,Female,Yes": 20
};

Object.keys(counts).forEach(function(key) {
  var parts = key.split(","),
      n = counts[key];
  for (var i = 0; i < n; i++) {
    data.push({Class: parts[0], Sex: parts[1], Survived: parts[2]});
  }
});

var chart = d3.parsets()
    .dimensions(["Class", "Sex", "Survived"])
    .width(960)
    .height(600)
    .on("sortDimensions", function() { console.log("sortDimensions fired"); })
    .on("sortCategories", function() { console.log("sortCategories fired"); });

d3.select("svg")
    .datum(data)
    .call(chart);
</script>
</body>
</html>
